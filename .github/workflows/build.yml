name: Build ApkUp Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ApkUp source
        run: |
          unzip -q ApkUp-1.46.0-source-trimmed.zip -d source

      - name: Build APK
        working-directory: source/apkup-1.46.0
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApkUp-1.46.0-debug
          path: source/apkup-1.46.0/app/build/outputs/apk/debug/*.apk
          
